; برایِ هاست‌هایی که PHP را با PHP-FPM/CGI اجرا می‌کنند (نه mod_php) — این
; فایل به‌جایِ .htaccess اثر می‌کند. معمولاً بدونِ نیاز به ری‌استارت، فقط
; بعد از چند دقیقه (user_ini.cache_ttl هاست) اعمال می‌شود.
upload_max_filesize = 200M
post_max_size = 200M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
