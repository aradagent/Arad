<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:V;src:url(v700.ttf);font-weight:700}
@font-face{font-family:V;src:url(v900.ttf);font-weight:900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:V,sans-serif;background:#000}
.shot{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.shot img{display:block;width:100%;height:100%}
.fx{position:absolute;inset:0;pointer-events:none}
#grain,#vig{position:absolute;inset:0;pointer-events:none;z-index:50}
#card,#sub{z-index:60}
#vig{background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 50%,rgba(0,0,0,.6) 100%)}
#card{position:absolute;top:250px;left:80px;right:80px;text-align:center;direction:rtl}
#card span{display:inline-block;background:rgba(16,14,12,.78);color:#f3e6c8;font-weight:900;font-size:58px;line-height:1.35;padding:20px 38px;border-radius:20px;border:3px solid #c9a04a;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#sub{position:absolute;top:1290px;left:100px;right:100px;text-align:center;direction:rtl}
#sub span{display:inline-block;background:rgba(0,0,0,.7);color:#fff;font-weight:700;font-size:44px;line-height:1.5;padding:12px 28px;border-radius:16px}
.bub{position:absolute;direction:rtl;font-family:V;font-weight:700;color:#fff;background:#3b82c4;border-radius:22px;padding:6px 16px;white-space:nowrap;box-shadow:0 0 18px rgba(120,190,255,.55)}
.tag{position:absolute;transform:translate(-50%,-50%);direction:rtl;font-family:V;font-weight:900;color:#f3e6c8;background:rgba(10,10,10,.75);border:3px solid #c9a04a;border-radius:16px;padding:8px 22px;font-size:46px;white-space:nowrap}
</style>
</head>
<body>
<div id="stage">
  <div id="shots"></div>
  <svg id="grain" width="1080" height="1920"></svg>
  <div id="vig"></div>
  <div id="card"><span></span></div>
  <div id="sub"><span></span></div>
</div>
<script>
const SUBS=new URLSearchParams(location.search).get('subs')==='1';
const END=72, IW=768, IH=1376;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const fa=s=>s;

/* fog / steam / smoke particles in image-relative % coordinates */
function puffs(lt,{n=6,x0=0,x1=100,y0=40,y1=90,size=40,speed=4,op=.25,rise=0,color='255,255,255'}){
  let o='';for(let i=0;i<n;i++){const ph=i*1.618;const x=x0+((i/n*(x1-x0)+lt*speed*(i%2?1:-.6))%(x1-x0)+(x1-x0))%(x1-x0);
    const y=y0+(i*37%100)/100*(y1-y0)-((lt*rise+i*7)%40)*(rise?1:0);const s=size*(.8+.4*Math.sin(lt*.5+ph));
    o+=`<div style="position:absolute;left:${x}%;top:${y}%;width:${s}%;height:${s*.6}%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(${color},${op}),rgba(${color},0));"></div>`}
  return o}
function steam(lt,x,y,w=6,h=12){let o='';for(let i=0;i<3;i++){const k=((lt*.35+i/3)%1);
  o+=`<div style="position:absolute;left:${x+Math.sin(lt*2+i)*1.2}%;top:${y-k*h}%;width:${w*(1+k)}%;height:${w*1.6*(1+k)*.5625}%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,${.35*(1-k)}),rgba(255,255,255,0));filter:blur(4px)"></div>`}return o}
function spot(x,y,r,o){return `<div style="position:absolute;inset:0;background:radial-gradient(circle at ${x}% ${y}%, rgba(0,0,0,0) ${r}%, rgba(0,0,0,${o}) ${r+8}%)"></div>`}
function flicker(t,seed=1){return 1+.05*Math.sin(t*23*seed)+.04*Math.sin(t*37+seed)+.03*Math.sin(t*61)}

/* shots: c = focus point (0..1 in image), k = zoom (1 = cover) */
const shots=[
 {s:0,e:5,img:'2.jpg',a:{x:.5,y:.47,k:1.0},b:{x:.48,y:.5,k:1.16},
  filt:t=>'sepia(.15) contrast(1.05)',fx:lt=>puffs(lt,{n:7,y0:20,y1:75,size:70,speed:2.5,op:.22})},
 {s:5,e:8.5,img:'1.jpg',a:{x:.5,y:.55,k:1.12},b:{x:.45,y:.6,k:1.0},
  filt:t=>`brightness(${flicker(t,.7)}) contrast(1.08)`,fx:lt=>puffs(lt,{n:5,y0:55,y1:95,size:60,speed:1.5,op:.12,color:'200,210,230'})},
 {s:8.5,e:12,img:'3.jpg',a:{x:.5,y:.55,k:1.0},b:{x:.6,y:.5,k:1.3},
  filt:t=>'sepia(.1)',fx:lt=>steam(lt,77,72,8,14)+steam(lt,38,22,10,20)},
 {s:12,e:20,img:'4.jpg',a:{x:.5,y:.5,k:1.0},b:{x:.55,y:.6,k:1.45},
  filt:t=>`brightness(${flicker(t,1.3)})`,fx:lt=>''},
 {s:20,e:28,img:'5.jpg',a:{x:.5,y:.6,k:1.0},b:{x:.48,y:.45,k:1.3},
  filt:t=>`brightness(${flicker(t,.9)})`,fx:lt=>puffs(lt,{n:6,x0:5,x1:95,y0:35,y1:70,size:45,speed:1.2,op:.18,rise:.8,color:'230,225,215'})},
 {s:28,e:35,img:'6.jpg',a:{x:.3,y:.36,k:1.75},b:{x:.28,y:.34,k:2.1},
  filt:t=>'saturate(1.15) brightness(1.08) sepia(.2)',fx:lt=>''},
 {s:35,e:39,img:'6.jpg',a:{x:.62,y:.72,k:1.6},b:{x:.55,y:.66,k:1.2},
  filt:t=>'',fx:lt=>''},
 {s:39,e:43,img:'7.jpg',a:{x:.52,y:.52,k:1.18},b:{x:.46,y:.5,k:1.0},
  filt:t=>'',fx:lt=>puffs(lt,{n:8,x0:0,x1:100,y0:20,y1:90,size:55,speed:3,op:.22,color:'240,225,200'})},
 {s:43,e:49,img:'6.jpg',a:{x:.28,y:.34,k:2.1},b:{x:.3,y:.36,k:1.8},
  filt:t=>'grayscale(.75) brightness(.55) contrast(1.15)',fx:lt=>spot(30,34,14,.55)},
 {s:49,e:60,img:'8.jpg',a:{x:.5,y:.5,k:1.0},b:{x:.5,y:.52,k:1.08},
  filt:t=>'',fx:lt=>{
    const items=[[34,37,'مقام جعلی'],[70,35,'محرمانه'],[27,73,'فرصت طلایی'],[69,72,'عجله']];
    let o='';const idx=Math.floor((lt-2.2)/2.2);
    if(lt>2.2&&idx<4){const [x,y]=items[Math.min(idx,3)];o+=spot(x,y,15,.6)}
    items.forEach(([x,y,t],i)=>{const at=2.2+i*2.2,g=eo((lt-at)/.4);if(g>0)o+=`<div class="tag" style="left:${x}%;top:${y+11}%;opacity:${g};transform:translate(-50%,-50%) scale(${.7+.3*g})">${'۱۲۳۴'[i]}. ${t}</div>`});
    return o}},
 {s:60,e:67,img:'9.jpg',a:{x:.5,y:.45,k:1.0},b:{x:.5,y:.42,k:1.3},
  filt:t=>'',fx:lt=>{
    const ms=[['پشتیبانی هستیم',58.5,35.3],['به کسی نگو 🤫',44,40.2],['نرخ ویژه 💰',57,45.6],['فقط ۱۰ دقیقه! ⏰',52,51]];
    let o='';
    ms.forEach(([m,x,y],i)=>{const g=eo((lt-.8-i*1.1)/.35);if(g>0)o+=`<div class="bub" style="left:${x}%;top:${y}%;font-size:27px;padding:10px 22px;min-width:27%;text-align:center;transform:translate(-50%,-50%) scale(${g});background:${i%2?'#33363e':'#3b82c4'}">${m}</div>`});
    return o}},
 {s:67,e:72,img:'10.jpg',a:{x:.5,y:.5,k:1.18},b:{x:.5,y:.47,k:1.0},
  filt:t=>'saturate(1.1)',fx:lt=>''},
];

const scenes=[
 {s:0,e:5,card:'مردی که برج ایفل رو فروخت',sub:['سال ۱۹۲۵، یه مرد، برج ایفل رو فروخت.','مشکل اینجا بود که برج ایفل مال اون نبود.']},
 {s:5,e:12,card:'پاریس، ۱۹۲۵',sub:['اسمش ویکتور لاستیگ بود.','یه روز تو روزنامه خوند که نگهداری برج ایفل برای شهر خیلی گرون تموم می‌شه.','و یه فکر به سرش زد.']},
 {s:12,e:20,card:'سربرگ جعلی + جلسه‌ی «محرمانه»',sub:['نامه‌هایی با سربرگ جعلی دولت درست کرد','و تاجرهای آهن قراضه‌ی پاریس رو','به یه جلسه‌ی «محرمانه» تو یه هتل لوکس دعوت کرد.']},
 {s:20,e:28,card:'«این خبر نباید درز کنه» 🤫',sub:['تو جلسه گفت:','«دولت تصمیم گرفته برج رو برچیده و آهنش رو بفروشه.','ولی این خبر نباید جایی درز کنه.»']},
 {s:28,e:35,card:'طعمه: فرصت بزرگ',sub:['یکی از تاجرها، آندره پواسون، بیشتر از همه هیجان‌زده بود.','این قرارداد می‌تونست اسمش رو بین بزرگ‌ترها ثبت کنه.']},
 {s:35,e:43,card:'پول + رشوه ← فرار',sub:['پواسون پول رو داد.','لاستیگ حتی یه رشوه‌ی جدا هم ازش گرفت.','و همون روز، با یه چمدون پر از پول، از پاریس رفت.']},
 {s:43,e:49,card:'قربانی از خجالت ساکت موند',sub:['عجیب‌ترین بخش؟','پواسون اون‌قدر خجالت کشید که هیچ‌وقت شکایت نکرد.']},
 {s:49,e:60,card:'۴ ترفند کلاهبردار',sub:['ترفندهای لاستیگ رو ببین:','یک، خودش رو مقام رسمی جا زد.','دو، گفت «محرمانه‌ست، به کسی نگو».','سه، یه فرصت استثنایی جلوی چشم گذاشت.','چهار، عجله ایجاد کرد.']},
 {s:60,e:67,card:'۱۹۲۵ ← امروز: همون ترفندها',sub:['صد سال گذشته، ولی ترفندها همونه.','«پشتیبانی هستیم»، «به کسی نگو»، «نرخ ویژه»، «فقط ده دقیقه».','فقط برج ایفل جاش رو داده به پیام تلگرامی.']},
 {s:67,e:72,card:'برای کسی بفرست که فکر می‌کنه گول نمی‌خوره',sub:['این داستان رو برای کسی بفرست که فکر می‌کنه «من گول نمی‌خورم».','پواسون هم همین فکر رو می‌کرد.']},
];

const shotsEl=document.getElementById('shots');
const els=shots.map(sh=>{const d=document.createElement('div');d.className='shot';d.innerHTML=`<img src="${sh.img}"><div class="fx"></div>`;shotsEl.appendChild(d);return d});
const XF=.5;
function place(el,sh,t){
  const p=eio((t-sh.s)/(sh.e-sh.s));
  const k=lerp(sh.a.k,sh.b.k,p),cx=lerp(sh.a.x,sh.b.x,p),cy=lerp(sh.a.y,sh.b.y,p);
  const base=Math.max(1080/IW,1920/IH),w=IW*base*k,h=IH*base*k;
  let L=540-cx*w,T=960-cy*h;L=Math.min(0,Math.max(1080-w,L));T=Math.min(0,Math.max(1920-h,T));
  el.style.width=w+'px';el.style.height=h+'px';el.style.transform=`translate(${L}px,${T}px)`;
  el.querySelector('img').style.filter=sh.filt(t);
  el.querySelector('.fx').innerHTML=sh.fx(t-sh.s);
}
function grain(t){let o='';let sd=(Math.floor(t*24)+7)*9301;for(let i=0;i<160;i++){sd=(sd*9301+49297)%233280;const x=sd/233280*1080;sd=(sd*9301+49297)%233280;const y=sd/233280*1920;
  o+=`<rect x="${x}" y="${y}" width="2.5" height="2.5" fill="${i%2?'#fff':'#000'}" opacity=".18"/>`}
  if(Math.floor(t*24)%37===0)o+=`<rect x="${(t*997)%1080}" y="0" width="2" height="1920" fill="#fff" opacity=".12"/>`;
  return o}
function render(t){
  shots.forEach((sh,i)=>{const el=els[i];
    const vis=t>=sh.s-XF&&t<sh.e+XF;
    if(!vis){el.style.display='none';return}
    el.style.display='block';
    let op=1;if(sh.s>0)op=Math.min(op,clamp((t-(sh.s-XF))/(2*XF)));
    if(sh.e<END)op=Math.min(op,1);else op=Math.min(op,clamp((END-t)/.8));
    el.style.opacity=op;el.style.zIndex=i;
    place(el,sh,t)});
  const fadeStart=clamp(t/.6);
  shotsEl.style.opacity=fadeStart;
  document.getElementById('grain').innerHTML=t<60||t>=67?grain(t):'';
  const sc=scenes.find(s=>t>=s.s&&t<s.e)||scenes[scenes.length-1];
  const lt=t-sc.s,d=sc.e-sc.s;
  const card=document.getElementById('card');card.querySelector('span').textContent=sc.card;
  const cp=eo((lt-.3)/.5),cf=sc.e===END?clamp((END-t)/.6):clamp((d-lt)/.35);
  card.style.opacity=cp*cf;card.style.transform=`translateY(${lerp(-30,0,cp)}px)`;
  const sub=document.getElementById('sub');
  if(SUBS){const seg=d/sc.sub.length,i=Math.min(sc.sub.length-1,Math.floor(lt/seg));sub.querySelector('span').textContent=sc.sub[i];sub.style.opacity=cf}else sub.style.opacity=0;
}
window.render=render;
Promise.all([...document.images].map(i=>i.decode())).then(()=>render(0));
</script>
</body>
</html>
