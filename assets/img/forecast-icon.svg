<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="bar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="trend" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
  </defs>

  <circle cx="64" cy="64" r="64" fill="url(#bg)"/>

  <!-- ستون‌های صعودیِ نمودار -->
  <rect x="30" y="70" width="11" height="24" rx="3" fill="url(#bar)" opacity="0.55"/>
  <rect x="47" y="58" width="11" height="36" rx="3" fill="url(#bar)" opacity="0.75"/>
  <rect x="64" y="44" width="11" height="50" rx="3" fill="url(#bar)" opacity="0.9"/>
  <rect x="81" y="30" width="11" height="64" rx="3" fill="url(#bar)"/>

  <!-- مسیرِ نقطه‌چین پیش‌بینی که رو به بالا ادامه پیدا می‌کند -->
  <path d="M30 68 L47 56 L64 42 L81 27 L98 16" fill="none" stroke="url(#trend)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="1 10"/>

  <!-- نقطه‌ی هدف/تارگت در انتهای مسیر -->
  <circle cx="98" cy="16" r="7" fill="none" stroke="url(#trend)" stroke-width="3"/>
  <circle cx="98" cy="16" r="2.5" fill="url(#trend)"/>
</svg>
